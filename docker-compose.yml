# Applicazione e PostgreSQL 16 (ARCHITETTURA.md, sezione Deploy).
#
#   mvn clean package              # prima: produce target/notifiche-csirt-0.1.0-SNAPSHOT.jar
#   docker compose up --build      # app su http://localhost:8080, utenti demo (profilo demo)
#
# Solo il database, per avviare l'applicazione da Maven:
#   docker compose up -d db
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres,demo
#
# In un'installazione reale: togliere "demo" dai profili e cambiare le credenziali del database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notifiche
      POSTGRES_USER: notifiche
      POSTGRES_PASSWORD: notifiche
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifiche -d notifiche"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,demo
      DB_URL: jdbc:postgresql://db:5432/notifiche
      DB_USER: notifiche
      DB_PASSWORD: notifiche
    ports:
      - "8080:8080"

volumes:
  dbdata:
